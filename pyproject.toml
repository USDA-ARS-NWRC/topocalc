[build-system]
requires = [
    "setuptools>=61.0",
    "setuptools_scm",
    "wheel",
    "cython",
    "numpy"
]
build-backend = "setuptools.build_meta"

[project]
name = "topocalc"
description = "Topo calculations like gradient and sky view"
authors = [
    { name = "USDA ARS NWRC", email = "snow@ars.usda.gov" }
]
version = "0.1.1"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.13"
keywords = ["topocalc"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.13"
]
dependencies = [
    "numpy>=2.1",
    "Click>=7.0",
    "spatialnc>=0.2.12",
    "setuptools_scm"
]


[project.urls]
Homepage = "https://github.com/USDA-ARS-NWRC/topocalc"

[project.scripts]
topocalc = "topocalc.cli:main"

[tool.setuptools]
packages = ["topocalc", "topocalc.core_c"]

[tool.setuptools.package-data]
"topocalc" = ["*.txt", "*.md"]
"topocalc.core_c" = ["*.pxd", "*.pyx", "*.c"]

[tool.setuptools_scm]
local_scheme = "no-local-version"